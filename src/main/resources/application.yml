spring:
  application:
    name: kyung-backend

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: KYUNG_USER
    password: kyung_password
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        use_sql_comments: true

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 100MB

server:
  port: 8080

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method

jwt:
  secret: your-jwt-secret-key-must-be-at-least-32-bytes
  access-expiration-ms: 3600000
  refresh-expiration-ms: 1209600000

security:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

file:
  upload:
    max-size: 30MB
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - pdf

logging:
  level:
    root: info
    org.springframework.security: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

